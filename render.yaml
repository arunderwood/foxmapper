# Render blueprint.
#
# The SSE settings below are **correctness, not tuning**. A buffering proxy makes every report
# take minutes to appear instead of seconds — and it fails silently, only in production, on the
# one requirement (SC-002) that the whole product is for.

# Grouping the relay and its database under a project keeps them together in the Render
# dashboard instead of landing in "Ungrouped Services". The environment is where the resources
# actually live; `production` is the only one this blueprint deploys.
projects:
  - name: foxmapper
    environments:
      - name: production
        services:
          - type: web
            name: foxmapper
            runtime: docker
            # One image: the relay serves the PWA from the same origin it streams from.
            dockerfilePath: ./Dockerfile
            dockerContext: .
            plan: starter
            healthCheckPath: /health
            # Wait for CI. The default is `commit`, which ships every push to main whether the tests
            # passed or not — and the one thing this service exists for is a hunt happening outdoors,
            # where nobody is watching the dashboard and a red build looks exactly like a green one.
            autoDeployTrigger: checksPass
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: foxmapper-db
                  property: connectionString
              - key: BIND_ADDR
                value: 0.0.0.0:8080
              - key: RUST_LOG
                value: foxmapper_server=info,tower_http=warn
              # Analytics is a build-time concern: Vite bakes these into the PWA bundle, and Render
              # exposes service env vars to the Docker build as args (see the ARGs in ./Dockerfile).
              # The key is a project secret set in the dashboard; with it unset the bundle ships with
              # analytics off. The web app is anonymous, opt-out, and honours Do Not Track — no PII.
              - key: VITE_PUBLIC_POSTHOG_KEY
                sync: false
              - key: VITE_PUBLIC_POSTHOG_HOST
                value: https://us.i.posthog.com
              # Which address the append rate limit keys on.
              #
              # Cloudflare fronts Render, so the relay's peer address is a proxy and every visitor
              # would otherwise share one rate-limit bucket — a single script could 429 an entire
              # hunt. Naming a header splits those buckets apart. That is collateral damage
              # reduction, not robustness: the byte and batch caps in server/src/routes/reports.rs
              # are what actually bound consumption, and they hold whatever the key is.
              #
              # CF-Connecting-IP because Cloudflare generates it from the connection it terminates,
              # so a caller cannot inject one, and Render states that all inbound traffic to its web
              # services passes through Cloudflare — so there is no origin-bypass path to inject one
              # through either. Not True-Client-IP: Cloudflare documents it as identical but
              # Enterprise-plan only, which makes it contingent on Render's billing rather than on
              # anything here.
              #
              # NOT X-Forwarded-For, which is what Render's own DDoS article recommends. Cloudflare
              # documents that it *appends* to an existing X-Forwarded-For, so a caller who sends
              # one is the leftmost entry the app reads. Keying the limiter on a value the caller
              # chooses does not weaken it, it deletes it — rotate the header, mint unlimited
              # buckets — which is worse than a shared bucket, where an attacker at least drains the
              # one they are in. The relay refuses this header for that reason: setting it here
              # would log a warning and fall back to the peer address.
              #
              # Unconfirmed on real traffic, and safe to ship that way: a header that never arrives
              # falls back to the peer address, which is what the relay did before this existed. The
              # deploy log settles it — `keying the rate limit on a forwarded header` at startup,
              # then a single `no usable address in the trusted header` warning if it is absent. A
              # warning there means this line is wrong, not that the relay is broken.
              - key: TRUSTED_CLIENT_IP_HEADER
                value: CF-Connecting-IP
            # Render's proxy terminates HTTP/2 and does not buffer proxied responses, which is what SSE
            # needs. The relay sets `X-Accel-Buffering: no` and `Cache-Control: no-transform` on the
            # stream itself as well, because that header is what any nginx in the path reads — and the
            # next place this gets deployed will have one.
            #
            # T069 exists because none of the above can be trusted without checking: `curl -N` against the
            # deployed URL must show events arriving one at a time. A burst means a proxy is buffering and
            # SC-002 is failing invisibly.

        databases:
          - name: foxmapper-db
            plan: basic-256mb
            postgresMajorVersion: '18'
