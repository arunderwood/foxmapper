version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Transitive deps too, not just the manifest-declared ones. Dependabot's default covers only
    # what the manifest names, so everything below a direct dependency moves solely when a security
    # advisory fires -- by which point it is several versions back and the bump drags a new floor
    # in with it. Tracking the whole lockfile keeps each advisory a one-line change.
    allow:
      - dependency-type: all
    # posthog-js pulls web-vitals in twice: once under its own name, and once as the alias
    # `web-vitals-soft-navs: npm:web-vitals@6.2.1`. Tracking the whole lockfile puts that alias key
    # in front of Dependabot as if it were a package, the registry answers 404, and a single
    # unresolvable entry fails the whole update run -- so none of the PRs it had already prepared
    # open. Skipping the alias costs nothing: what sits behind it is the `web-vitals` that
    # posthog-js also names directly, which stays tracked.
    ignore:
      - dependency-name: web-vitals-soft-navs
    groups:
      # Majors stay separate so a breaking change lands in a PR of its own.
      web-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
    # Transitive crates too, for the reason given on the npm entry above.
    allow:
      - dependency-type: all
    groups:
      server-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # The compiler pin itself. Ungrouped and on its own: a toolchain bump rebuilds the world and can
  # surface new clippy lints, so it deserves to fail in a PR of its own rather than inside a batch.
  - package-ecosystem: rust-toolchain
    directory: /server
    schedule:
      interval: weekly

  # Root Dockerfile builds the single deploy image; server/Dockerfile is the compose dev build.
  #
  # Ungrouped on purpose, so each image moves in a PR of its own. That matters most for the
  # distroless runtime base, which is pinned by digest: `:nonroot` is a rolling tag with no semver
  # component, so without the digest the base would change underneath a build with no PR and no
  # record of what actually shipped. The digest makes that change a reviewable event; keeping it
  # out of a batch keeps it a legible one. (One entry, not two: Dependabot rejects a second
  # `docker` block for a directory already covered here.)
  - package-ecosystem: docker
    directories:
      - /
      - /server
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
