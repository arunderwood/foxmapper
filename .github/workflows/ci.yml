name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to a PR makes the first run's answer worthless, so stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foxmapper_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/foxmapper_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          # No shared-key with the e2e job, deliberately. The two caches look redundant and are
          # not: this job builds --all-targets and the test binaries, e2e builds only the bin.
          # Sharing one key means whichever job finishes first writes the cache and the other's
          # save is rejected — e2e always wins, so this job would restore a target/ with no test
          # artifacts and recompile them every run.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: foxmapper
          POSTGRES_PASSWORD: foxmapper
          POSTGRES_DB: foxmapper
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://foxmapper:foxmapper@localhost:5432/foxmapper
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      # Keyed on the Playwright version rather than the lockfile hash: browser builds only
      # change when Playwright does, and hashing the lockfile would evict them on every
      # unrelated dependency bump.
      - name: Resolve Playwright version
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: web
      # The browser binaries are cached but the OS packages they link against are not, so a
      # cache hit still needs the system deps installed.
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: web

      # The E2E suite drives the real relay, not a mock: the sync cursor, the SSE stream and the
      # idempotent append are the things most likely to break, and a mock would assert our
      # assumptions back at us.
      - name: Start the relay
        run: |
          cargo build --manifest-path server/Cargo.toml
          BIND_ADDR=127.0.0.1:8080 ./server/target/debug/foxmapper-server &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health >/dev/null; then
              echo "relay healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::relay did not answer /health within 120s; not running E2E against a dead port"
          exit 1
      - run: npm run test:e2e -- --project=chromium
        working-directory: web
