# Development stack: Postgres, the relay, and the PWA.
#
# The relay has no opinion about direction finding, so there is nothing to configure here beyond
# a database URL — every service below would be identical if the payload were recipes.
services:
  db:
    # Debian-based, not -alpine: Render's managed Postgres is glibc, and so is CI. Alpine's musl
    # locale support collates text differently, which would only ever surface as an ORDER BY that
    # disagrees with production. Major version tracks render.yaml's postgresMajorVersion.
    image: postgres:18
    environment:
      POSTGRES_USER: foxmapper
      POSTGRES_PASSWORD: foxmapper
      POSTGRES_DB: foxmapper
    ports:
      - '5432:5432'
    volumes:
      # 18+ images put PGDATA in a version-specific subdirectory (/var/lib/postgresql/18/docker),
      # so the mount is the parent. Mounting the old path makes the image refuse to start, even on
      # an empty volume.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foxmapper']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgres://foxmapper:foxmapper@db:5432/foxmapper
      RUST_LOG: foxmapper_server=debug,tower_http=debug
      BIND_ADDR: 0.0.0.0:8080
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/app/target

  web:
    image: node:26-alpine
    working_dir: /app
    environment:
      # Vite proxies /api to the relay, so the browser sees one origin and SSE needs no CORS —
      # matching production, where the relay serves the bundle itself and no CORS exists anywhere.
      # This is the PROXY TARGET (vite.config.ts), reached from inside the web container, so it
      # names the compose service. Setting VITE_API_ORIGIN here instead would bake a cross-origin
      # API base into the bundle and every sync request would die on the server's absent CORS.
      FOXMAPPER_RELAY: http://server:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - '5173:5173'
    depends_on:
      - server
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules

volumes:
  db-data:
  cargo-registry:
  target-cache:
  web-node-modules:
